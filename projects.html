<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects · Nidhi Kalyanshetti</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><a class="back" href="index.html">Back to home</a><h1>Projects</h1><p class="sub">Add a project by editing projects.json.</p>
<div class="filters" id="filters"></div><div class="grid" id="grid"></div></main><footer id="foot"></footer>
<script src="site.js"></script>
<script>
let all=[],tag="All";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(){
 const list=all.filter(p=>tag==="All"||p.tags.includes(tag));
 grid.innerHTML=list.length?list.map(p=>`<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="links">${p.github?`<a href="${esc(p.github)}">GitHub</a>`:""}${p.demo?`<a href="${esc(p.demo)}">Live demo</a>`:""}</div></article>`).join(""):'<p class="empty">No projects with this tag yet.</p>';
 filters.innerHTML=["All",...new Set(all.flatMap(p=>p.tags))].map(t=>`<button aria-pressed="${t===tag}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
 filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{tag=b.dataset.t;show()});
}
fetch("projects.json").then(r=>r.json()).then(d=>{all=d;show()}).catch(()=>{grid.innerHTML='<p class="empty">Could not load projects.json. Open the site through a web server or GitHub Pages, not by double-clicking the file.</p>'});
</script></body></html>
